<div class="auth-card forgot-card">

  <!-- BRAND HEADER -->
  <div class="brand-header">
    <div class="brand-logo-wrap">
      <img src="assets/images/B2WA_logo.png" alt="Logo B2WA" class="brand-logo" />
    </div>
    <div class="brand-info">
      <h3>B2WA</h3>
      <small>BUSINESS TO WEST AFRICA</small>
    </div>
  </div>

  <!-- TITRE & SOUS-TITRE -->
  <div class="auth-title">
    <span class="eyebrow">MOT DE PASSE OUBLIÉ</span>
    <p>
      Saisissez votre adresse email enregistrée pour recevoir un code OTP à 6 chiffres.
    </p>
  </div>

  <!-- FORMULAIRE DE SAISIE EMAIL -->
  <form 
    [formGroup]="forgotForm" 
    (ngSubmit)="onSubmit()" 
    class="auth-form"
    autocomplete="off"
  >
    <div class="form-group">
      <label for="email">Adresse email</label>
      <div 
        class="input-wrap"
        [class.input-error]="emailControl?.touched && emailControl?.invalid"
      >
        <span class="material-symbols-outlined input-icon">mail</span>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="exemple@domaine.com"
          autocomplete="off"
        />
      </div>
      
      <small class="error-msg" *ngIf="emailControl?.touched && emailControl?.errors?.['required']">
        L'adresse email est requise.
      </small>
      <small class="error-msg" *ngIf="emailControl?.touched && emailControl?.errors?.['email']">
        Veuillez entrer une adresse email valide.
      </small>
    </div>

    <button 
      type="submit" 
      class="submit-btn" 
      [disabled]="forgotForm.invalid || isLoading"
    >
      <span *ngIf="!isLoading" class="material-symbols-outlined btn-icon">send</span>
      <span *ngIf="isLoading" class="spinner"></span>
      <span>{{ isLoading ? 'Envoi du code...' : 'Envoyer le code OTP' }}</span>
    </button>
  </form>

  <!-- FOOTER -->
  <div class="form-footer-link">
    <span>Vous vous en souvenez ?</span>
    <a routerLink="/auth/login" class="link-highlight">Se connecter</a>
  </div>

</div>
