@if (visible) {
  <div class="modal-backdrop">
    <div class="community-modal live-modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">
          <div class="modal-icon red">
            <span class="material-symbols-outlined">videocam</span>
          </div>
          <div>
            <span class="modal-kicker red-kicker">B2WA LIVE</span>
            <h2>Programmer un Live</h2>
          </div>
        </div>
        <button type="button" class="modal-close" (click)="closeModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label>Couverture du Live</label>
          <label class="live-upload">
            @if (liveForm.coverPreview) {
              <img [src]="liveForm.coverPreview" alt="Aperçu" style="max-width:100%;max-height:160px;border-radius:8px;object-fit:cover;" />
              <strong>Changer la couverture</strong>
            } @else {
              <span class="material-symbols-outlined">image</span>
              <strong>Ajouter une couverture</strong>
              <small>Cette image sera affichée sur la page du Live.</small>
            }
            <input type="file" accept="image/png,image/jpeg,image/webp" (change)="onLiveImageSelected($event)" />
          </label>
        </div>

        <div class="form-group">
          <label>Titre du Live</label>
          <input type="text" placeholder="Ex : Les nouveautés du commerce malien" [(ngModel)]="liveForm.title" />
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea rows="3" placeholder="Présentez votre événement..." [(ngModel)]="liveForm.description"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Date</label>
            <input type="date" [(ngModel)]="liveForm.date" />
          </div>

          <div class="form-group">
            <label>Heure</label>
            <input type="time" [(ngModel)]="liveForm.time" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Durée</label>
            <select [(ngModel)]="liveForm.duration">
              <option value="30">30 minutes</option>
              <option value="60">1 heure</option>
              <option value="90">1h30</option>
              <option value="120">2 heures</option>
            </select>
          </div>

          <div class="form-group">
            <label>Places disponibles</label>
            <input type="number" min="1" placeholder="100" [(ngModel)]="liveForm.capacity" />
          </div>
        </div>

        <div class="live-link-info">
          <div class="live-link-icon">
            <span class="material-symbols-outlined">link</span>
          </div>
          <div>
            <strong>Votre lien B2WA Live sera créé automatiquement</strong>
            <p>Après la programmation, B2WA générera automatiquement un lien unique que vous pourrez partager avec votre communauté.</p>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="cancel-btn" (click)="closeModal()">Annuler</button>
        <button type="button" class="primary-btn red-btn" [disabled]="!canPublishLive" (click)="publishLive()">
          <span class="material-symbols-outlined">event</span>
          Programmer le Live
        </button>
      </div>
    </div>
  </div>
}
